<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Temple Explorer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #071018; color: #e8f1ff; font-family: Arial, sans-serif; }
    #hud { position: fixed; left: 16px; top: 16px; background: rgba(7, 16, 24, 0.72); padding: 12px 14px; border-radius: 12px; max-width: 320px; }
    #hud h1 { font-size: 18px; margin: 0 0 6px; }
    #hud p { margin: 0; font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>3D Temple Explorer</h1>
    <p>WASD or arrow keys to walk. The Kinetic Engine: scene, camera, lights, bloom, instanced pillars, procedural terrain, generated textures.</p>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071018);
    scene.fog = new THREE.Fog(0x071018, 18, 70);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 2.2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0x9ecbff, 0x2a2418, 0.7);
    scene.add(hemi);
    const moon = new THREE.DirectionalLight(0xfff1c9, 1.3);
    moon.position.set(-8, 14, 6);
    scene.add(moon);
    const lantern = new THREE.PointLight(0xffb15a, 8, 18);
    lantern.position.set(0, 3.2, 0);
    scene.add(lantern);

    function makeTexture(painter) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      painter(canvas.getContext("2d"), canvas);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const stoneTex = makeTexture((ctx) => {
      ctx.fillStyle = "#8d8576";
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 80; i++) {
        ctx.fillStyle = `rgba(60,50,40,${Math.random() * 0.35})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 18, 8);
      }
    });
    stoneTex.repeat.set(8, 8);

    const goldTex = makeTexture((ctx) => {
      const g = ctx.createLinearGradient(0, 0, 256, 256);
      g.addColorStop(0, "#ffe08a");
      g.addColorStop(1, "#c9842a");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
    });

    const terrainGeo = new THREE.PlaneGeometry(80, 80, 80, 80);
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const h = Math.sin(x * 0.18) * 0.6 + Math.cos(y * 0.15) * 0.45;
      pos.setZ(i, h);
    }
    terrainGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9 })
    );
    terrain.rotation.x = -Math.PI / 2;
    scene.add(terrain);

    const pillarGeo = new THREE.CylinderGeometry(0.35, 0.4, 4.2, 8);
    const pillarMat = new THREE.MeshStandardMaterial({ map: goldTex, metalness: 0.4, roughness: 0.35, emissive: 0x3a2508, emissiveIntensity: 0.4 });
    const pillars = new THREE.InstancedMesh(pillarGeo, pillarMat, 24);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < 24; i++) {
      const angle = (i / 24) * Math.PI * 2;
      const radius = i % 2 === 0 ? 6 : 9;
      dummy.position.set(Math.cos(angle) * radius, 2.1, Math.sin(angle) * radius);
      dummy.updateMatrix();
      pillars.setMatrixAt(i, dummy.matrix);
    }
    scene.add(pillars);

    const shrine = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 2.4, 3.2),
      new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.8 })
    );
    shrine.position.y = 1.2;
    scene.add(shrine);
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(2.6, 1.4, 4),
      new THREE.MeshStandardMaterial({ color: 0xb6452d, roughness: 0.6 })
    );
    roof.position.y = 3.1;
    roof.rotation.y = Math.PI / 4;
    scene.add(roof);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.6, 0.85));

    const keys = new Set();
    addEventListener("keydown", (e) => keys.add(e.key.toLowerCase()));
    addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });

    const velocity = new THREE.Vector3();
    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const forward = (keys.has("w") || keys.has("arrowup") ? 1 : 0) - (keys.has("s") || keys.has("arrowdown") ? 1 : 0);
      const side = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
      velocity.set(side, 0, -forward).normalize().multiplyScalar(8 * dt);
      camera.position.add(velocity);
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -30, 30);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -30, 30);
      camera.position.y = 2.2;
      lantern.intensity = 7 + Math.sin(clock.elapsedTime * 3) * 1.5;
      composer.render();
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
