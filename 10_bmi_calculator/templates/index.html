<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BMI Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f3ea; }
    main { max-width: 520px; margin: 40px auto; background: white; padding: 24px; border-radius: 16px; }
    label { display: block; margin-top: 12px; }
    input, button { margin-top: 6px; padding: 8px; }
    .error { color: #a32020; }
  </style>
</head>
<body>
  <main>
    <h1>BMI Calculator</h1>
    <p>BMI = weight (kg) / height (m) squared.</p>
    <form method="post">
      <label>Weight (kg) <input type="number" step="0.1" name="weight" required /></label>
      <label>Height (cm) <input type="number" step="0.1" name="height" required /></label>
      <button type="submit">Calculate BMI</button>
    </form>
    {% if result %}
      {% if result.error %}
        <p class="error">{{ result.error }}</p>
      {% else %}
        <h2>{{ result.bmi }}</h2>
        <p>{{ result.weight }} kg · {{ result.height }} cm</p>
        <p>Category: <strong>{{ result.category }}</strong></p>
      {% endif %}
    {% endif %}
  </main>
</body>
</html>
