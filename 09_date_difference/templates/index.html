<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Difference between two dates</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; }
    main { max-width: 520px; margin: 40px auto; background: white; padding: 24px; border-radius: 16px; }
    label { display: block; margin-top: 12px; }
    input, button { margin-top: 6px; padding: 8px; }
    .error { color: #a32020; }
  </style>
</head>
<body>
  <main>
    <h1>Difference between two dates</h1>
    <form method="post">
      <label>Start date <input type="date" name="start" required /></label>
      <label>End date <input type="date" name="end" required /></label>
      <button type="submit">Calculate</button>
    </form>
    {% if result %}
      {% if result.error %}
        <p class="error">{{ result.error }}</p>
      {% else %}
        <h2>Result</h2>
        <p>{{ result.start }} to {{ result.end }}</p>
        <p><strong>{{ result.days }}</strong> day(s)</p>
        <p>{{ result.weeks }} week(s) and {{ result.extra_days }} day(s)</p>
      {% endif %}
    {% endif %}
  </main>
</body>
</html>
